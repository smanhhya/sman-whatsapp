
name: Sman WhatsApp Live Server

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: sman-whatsapp-single-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Tunnel
        run: |
          npm install --no-audit --no-fund
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Restore Encrypted WhatsApp Session
        env:
          WA_SESSION_B64: ${{ secrets.WA_SESSION_B64 }}
          WA_SESSION_B64_2: ${{ secrets.WA_SESSION_B64_2 }}
          WA_SESSION_B64_3: ${{ secrets.WA_SESSION_B64_3 }}
        run: |
          COMBINED_B64="${WA_SESSION_B64}${WA_SESSION_B64_2}${WA_SESSION_B64_3}"
          if [ -n "$COMBINED_B64" ]; then
            rm -rf auth_info_baileys
            mkdir -p auth_info_baileys
            printf "%s" "$COMBINED_B64" | base64 -d | tar -xzf - -C auth_info_baileys
            echo "✅ تم استرجاع جلسة الواتساب المشفرة بنجاح!"
          else
            echo "ℹ️ لا توجد جلسة مشفرة محفوظة بعد، سيتم توليد كود ربط جديد."
          fi

      - name: Start Server & Live Tunnel
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
        run: |
          ./cloudflared tunnel --no-autoupdate --url http://localhost:8080 > tunnel.log 2>&1 &

          TUNNEL_URL=""
          for k in {1..15}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "========================================="
          echo "🌐 رابط السيرفر المباشر للـ CRM هو:"
          echo "$TUNNEL_URL"
          echo "========================================="

          if [ -n "$TUNNEL_URL" ] && [ -n "$FIREBASE_EMAIL" ] && [ -n "$FIREBASE_PASSWORD" ]; then
            TUNNEL_URL="$TUNNEL_URL" node -e '
              (async () => {
                try {
                  const apiKey = "AIzaSyD7ZJP8n8fhMewPfEsTBANn0h9To_q15BY";
                  const authRes = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + apiKey, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      email: process.env.FIREBASE_EMAIL,
                      password: process.env.FIREBASE_PASSWORD,
                      returnSecureToken: true
                    })
                  });
                  const authData = await authRes.json();
                  if (!authData.idToken) {
                    console.log("⚠️ فشل تسجيل الدخول إلى Firebase لتحديث الرابط:", authData.error?.message || "Unknown error");
                    return;
                  }
                  const patchUrl = "https://firestore.googleapis.com/v1/projects/sman-ca8f8/databases/(default)/documents/inventory/settings?updateMask.fieldPaths=whatsappServerUrl";
                  const fsRes = await fetch(patchUrl, {
                    method: "PATCH",
                    headers: {
                      "Authorization": "Bearer " + authData.idToken,
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                      fields: {
                        whatsappServerUrl: { stringValue: process.env.TUNNEL_URL }
                      }
                    })
                  });
                  if (fsRes.ok) {
                    console.log("✅ تم إرسال وتحديث رابط السيرفر تلقائياً في قاعدة بيانات موقع سمان ههيا!");
                  } else {
                    const errTxt = await fsRes.text();
                    console.log("⚠️ فشل تحديث الرابط في Firestore:", errTxt);
                  }
                } catch (err) {
                  console.log("⚠️ خطأ أثناء مزامنة الرابط مع الموقع:", err.message);
                }
              })();
            '
          else
            echo "ℹ️ لم يتم ضبط FIREBASE_EMAIL أو FIREBASE_PASSWORD في Secrets، لن يتم التحديث التلقائي للرابط."
          fi

          (while true; do node index.js; sleep 3; done) &

          LAST_SAVED_B64=""

          save_session_to_secret() {
            if [ -f "auth_info_baileys/creds.json" ] && grep -q '"registered":true' "auth_info_baileys/creds.json"; then
              if [ -n "$GH_PAT" ]; then
                FULL_B64=$(tar -czf - -C auth_info_baileys . | base64 -w 0)
                if [ "$FULL_B64" != "$LAST_SAVED_B64" ]; then
                  PART1="${FULL_B64:0:40000}"
                  PART2="${FULL_B64:40000:40000}"
                  PART3="${FULL_B64:80000:40000}"
                  if printf "%s" "$PART1" | GH_TOKEN="$GH_PAT" gh secret set WA_SESSION_B64 --repo "${{ github.repository }}"; then
                    if [ -n "$PART2" ]; then
                      printf "%s" "$PART2" | GH_TOKEN="$GH_PAT" gh secret set WA_SESSION_B64_2 --repo "${{ github.repository }}" || true
                    else
                      GH_TOKEN="$GH_PAT" gh secret delete WA_SESSION_B64_2 --repo "${{ github.repository }}" 2>/dev/null || true
                    fi
                    if [ -n "$PART3" ]; then
                      printf "%s" "$PART3" | GH_TOKEN="$GH_PAT" gh secret set WA_SESSION_B64_3 --repo "${{ github.repository }}" || true
                    else
                      GH_TOKEN="$GH_PAT" gh secret delete WA_SESSION_B64_3 --repo "${{ github.repository }}" 2>/dev/null || true
                    fi
                    LAST_SAVED_B64="$FULL_B64"
                    echo "🔐 تم حفظ جلسة الواتساب في خزنة GitHub المشفرة بأمان تام!"
                  fi
                fi
              else
                echo "⚠️ تنبيه: لم يتم العثور على GH_PAT في Secrets، لن يتم حفظ الجلسة!"
              fi
            fi
          }

          for j in {1..12}; do
            sleep 15
            save_session_to_secret
          done

          for i in {1..64}; do
            sleep 300
            save_session_to_secret
          done
