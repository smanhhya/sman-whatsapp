name: Sman WhatsApp Live Server

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: sman-whatsapp-single-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Tunnel
        run: |
          npm install --no-audit --no-fund
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Restore Encrypted WhatsApp Session
        env:
          WA_SESSION_B64: ${{ secrets.WA_SESSION_B64 }}
          WA_SESSION_B64_2: ${{ secrets.WA_SESSION_B64_2 }}
        run: |
          COMBINED_B64="${WA_SESSION_B64}${WA_SESSION_B64_2}"
          if [ -n "$COMBINED_B64" ]; then
            rm -rf auth_info_baileys
            mkdir -p auth_info_baileys
            printf "%s" "$COMBINED_B64" | base64 -d | tar -xzf - -C auth_info_baileys
            echo "✅ تم استرجاع جلسة الواتساب المشفرة بنجاح!"
          else
            echo "ℹ️ لا توجد جلسة مشفرة محفوظة بعد، سيتم توليد كود ربط جديد."
          fi

      - name: Start Server & Live Tunnel
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            ./cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > tunnel.log 2>&1 &
            sleep 5
            echo "========================================="
            echo "🌐 تم تشغيل النفق الثابت (Cloudflare Fixed Tunnel) بنجاح!"
            echo "🔗 السيرفر متصل الآن على رابطك الثابت في Cloudflare"
            echo "========================================="
          else
            ./cloudflared tunnel --no-autoupdate --url http://localhost:8080 > tunnel.log 2>&1 &
            sleep 8
            echo "========================================="
            echo "🌐 رابط السيرفر المؤقت للـ CRM هو:"
            grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log | head -n 1
            echo "========================================="
          fi

          (while true; do node index.js; sleep 3; done) &

          LAST_SAVED_B64=""

          save_session_to_secret() {
            if [ -f "auth_info_baileys/creds.json" ] && grep -q '"registered":true' "auth_info_baileys/creds.json"; then
              if [ -n "$GH_PAT" ]; then
                FULL_B64=$(tar -czf - -C auth_info_baileys . | base64 -w 0)
                if [ "$FULL_B64" != "$LAST_SAVED_B64" ]; then
                  PART1="${FULL_B64:0:40000}"
                  PART2="${FULL_B64:40000:40000}"
                  if printf "%s" "$PART1" | GH_TOKEN="$GH_PAT" gh secret set WA_SESSION_B64 --repo "${{ github.repository }}"; then
                    if [ -n "$PART2" ]; then
                      printf "%s" "$PART2" | GH_TOKEN="$GH_PAT" gh secret set WA_SESSION_B64_2 --repo "${{ github.repository }}" || true
                    else
                      GH_TOKEN="$GH_PAT" gh secret delete WA_SESSION_B64_2 --repo "${{ github.repository }}" 2>/dev/null || true
                    fi
                    LAST_SAVED_B64="$FULL_B64"
                    echo "🔐 تم حفظ جلسة الواتساب في خزنة GitHub المشفرة بأمان تام!"
                  fi
                fi
              else
                echo "⚠️ تنبيه: لم يتم العثور على GH_PAT في Secrets، لن يتم حفظ الجلسة!"
              fi
            fi
          }

          for j in {1..12}; do
            sleep 15
            save_session_to_secret
          done

          for i in {1..64}; do
            sleep 300
            save_session_to_secret
          done
